name: tvbox
description: "TVBox Flutter 重写 - 影视聚合应用"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # 状态管理
  provider: ^6.1.2

  # 路由
  go_router: ^14.2.0

  # 网络
  dio: ^5.5.0
  http: ^1.2.2

  # 本地存储 (替代 Hawk)
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.3

  # 数据库 (替代 Room)
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.24

  # 工具
  path_provider: ^2.1.3
  path: ^1.9.0
  file_picker: ^8.0.7
  url_launcher: ^6.3.0
  crypto: ^3.0.3
  encrypt: ^5.0.3
  html: ^0.15.4
  xml: ^6.5.0
  intl: ^0.19.0
  uuid: ^4.4.0
  collection: ^1.18.0

  # 图片
  cached_network_image: ^3.4.1

  # WebView (替代 XWalk)
  webview_flutter: ^4.8.0

  # 播放器（桌面 libmpv；Android 用 ExoPlayer 平台通道）
  media_kit: ^1.1.11
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.5
  wakelock_plus: ^1.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.11
  hive_generator: ^2.0.1
  drift_dev: ^2.18.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/js/
    - assets/
